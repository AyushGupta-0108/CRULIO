<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to ManaunaDham...</title>
  <link rel="canonical" href="https://www.crulio.com/ManaunaDham">
  <meta name="robots" content="noindex, follow">
  <script>
    (function () {
      var destination = 'https://www.crulio.com/ManaunaDham';

      // CHANGE THIS to your actual Vercel backend domain.
      var TRACK_ENDPOINT = 'https://harshdeep-api.vercel.app/api/track-scan';

      var redirected = false;

      function goNow(lat, lon) {
        if (redirected) return; // safety: only ever redirect once
        redirected = true;

        var qs = [];
        if (lat != null && lon != null) {
          qs.push('lat=' + encodeURIComponent(lat));
          qs.push('lon=' + encodeURIComponent(lon));
        }
        var trackUrl = TRACK_ENDPOINT + (qs.length ? '?' + qs.join('&') : '');

        // Fire-and-forget — keepalive:true means this still completes
        // even after the browser starts navigating away.
        try {
          fetch(trackUrl, {
            method: 'GET',
            mode: 'cors',
            keepalive: true,
            cache: 'no-store'
          }).catch(function () {});
        } catch (e) {}

        window.location.replace(destination);
      }

      // Every printed QR points here, so the only way to tell WHICH
      // banner/location is working is to capture the phone's actual GPS
      // position at the moment of scanning. We wait up to 3 seconds for
      // the visitor to allow location access; if they deny it or don't
      // respond in time, we redirect anyway with no location attached.
      if (navigator.geolocation) {
        var timedOut = false;
        var timer = setTimeout(function () {
          timedOut = true;
          goNow(null, null);
        }, 3000);

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            if (timedOut) return;
            clearTimeout(timer);
            goNow(pos.coords.latitude, pos.coords.longitude);
          },
          function () {
            if (timedOut) return;
            clearTimeout(timer);
            goNow(null, null);
          },
          { enableHighAccuracy: false, timeout: 3000, maximumAge: 0 }
        );
      } else {
        goNow(null, null);
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://www.crulio.com/ManaunaDham">ManaunaDham</a>...</p>
</body>
</html>
