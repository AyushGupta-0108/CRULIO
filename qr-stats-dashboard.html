<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Scan Analytics — Crulio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; color: #1a1a1a; }
  h1 { font-size: 22px; margin: 0 0 2px; font-weight: 700; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
  h3 { font-size: 15px; font-weight: 600; margin: 24px 0 10px; }

  /* Auth row */
  .auth-row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .auth-row input { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; width: 220px; }
  .btn { padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; font-weight: 500; transition: opacity .15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #111827; color: #fff; }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn-export { background: #059669; color: #fff; }
  .btn-outline { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Filter bar */
  .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; background: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .filter-bar label { font-size: 12px; color: #6b7280; font-weight: 500; margin-right: 2px; }
  .filter-bar input[type=date] { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; }
  .range-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; color: #374151; font-size: 12px; cursor: pointer; }
  .range-btn.active { background: #111827; color: #fff; border-color: #111827; }

  /* Cards */
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 14px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.07); min-width: 130px; }
  .card .num { font-size: 28px; font-weight: 700; line-height: 1.1; }
  .card .label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

  /* Two-column layout for leaderboard + device */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

  /* Leaderboard */
  .leaderboard { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { font-size: 11px; color: #9ca3af; font-weight: 700; width: 18px; flex-shrink: 0; }
  .lb-name { flex: 1; color: #111827; }
  .lb-bar-wrap { width: 80px; background: #f3f4f6; border-radius: 4px; height: 6px; flex-shrink: 0; }
  .lb-bar { background: #e63946; border-radius: 4px; height: 6px; }
  .lb-count { font-weight: 600; width: 36px; text-align: right; flex-shrink: 0; }

  /* Hourly chart */
  .hourly-wrap { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .hour-bars { display: flex; align-items: flex-end; gap: 3px; height: 80px; margin-top: 8px; }
  .hour-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .hour-bar { width: 100%; background: #e63946; border-radius: 3px 3px 0 0; min-height: 2px; transition: height .3s; }
  .hour-label { font-size: 8px; color: #9ca3af; margin-top: 3px; }

  /* Device pie — simple bar chart */
  .device-wrap { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .device-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
  .device-name { width: 80px; flex-shrink: 0; }
  .device-bar-wrap { flex: 1; background: #f3f4f6; border-radius: 4px; height: 8px; }
  .device-bar { background: #3b82f6; border-radius: 4px; height: 8px; }
  .device-count { font-weight: 600; font-size: 13px; }

  /* Map */
  #map { height: 380px; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .note { font-size: 12px; color: #9ca3af; margin: 4px 0 14px; }

  /* Table */
  .table-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .table-wrap { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.07); margin-bottom: 24px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }
  th, td { text-align: left; padding: 8px 12px; font-size: 12px; border-bottom: 1px solid #f3f4f6; }
  th { background: #f9fafb; color: #6b7280; font-weight: 600; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tr.selected td { background: #fef2f2; }
  input[type=checkbox] { cursor: pointer; width: 14px; height: 14px; }

  .err { color: #dc2626; font-size: 13px; padding: 10px 0; }
  .empty { color: #9ca3af; font-size: 13px; padding: 20px; text-align: center; }
  .tag { display: inline-block; background: #f3f4f6; color: #374151; border-radius: 4px; padding: 2px 7px; font-size: 11px; }
</style>
</head>
<body>
  <h1>QR Scan Analytics</h1>
  <div class="sub">ManaunaDham · Crulio Networks</div>

  <div class="auth-row">
    <input id="adminKey" type="password" placeholder="Admin key" />
    <button class="btn btn-primary" onclick="load()">Load Data</button>
  </div>

  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  const STATS_API  = 'https://harshdeep-api.vercel.app/api/qr-stats';
  const DELETE_API = 'https://harshdeep-api.vercel.app/api/qr-delete';

  // ── STATE ───────────────────────────────────────────────────────────────────
  let map = null;
  let currentData = null;
  let selectedTs = new Set();
  let activeRange = 'all'; // 'today' | '7' | '30' | 'custom' | 'all'
  let customFrom = '';
  let customTo = '';

  // ── DATE HELPERS ─────────────────────────────────────────────────────────────
  function isoDate(d) { return d.toISOString().slice(0, 10); }
  function today() { return isoDate(new Date()); }
  function daysAgo(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return isoDate(d);
  }
  function rangeParams() {
    if (activeRange === 'today') return `&from=${today()}&to=${today()}`;
    if (activeRange === '7')     return `&from=${daysAgo(6)}&to=${today()}`;
    if (activeRange === '30')    return `&from=${daysAgo(29)}&to=${today()}`;
    if (activeRange === 'custom' && customFrom && customTo) return `&from=${customFrom}&to=${customTo}`;
    return '';
  }

  // ── LOAD ──────────────────────────────────────────────────────────────────────
  async function load() {
    const key = document.getElementById('adminKey').value.trim();
    if (!key) { alert('Enter your admin key first.'); return; }
    document.getElementById('root').innerHTML = '<p style="color:#6b7280;font-size:13px;padding:10px 0">Loading…</p>';
    try {
      const res = await fetch(`${STATS_API}?key=${encodeURIComponent(key)}${rangeParams()}`);
      if (!res.ok) throw new Error('Error ' + res.status + ' — check your admin key.');
      currentData = await res.json();
      selectedTs.clear();
      render(currentData);
    } catch(e) {
      document.getElementById('root').innerHTML = `<p class="err">${e.message}</p>`;
    }
  }

  // ── RENDER ────────────────────────────────────────────────────────────────────
  function render(data) {
    const root = document.getElementById('root');

    const located = data.recent.filter(r => r.lat != null && r.lon != null);
    const noLoc = data.recent.length - located.length;
    const todayStr = today();
    const todayEntry = data.days.find(d => d.date === todayStr);
    const todayCount = todayEntry ? todayEntry.count : 0;

    // ── Filter bar ────────────────────────────────────────────────────────────
    root.innerHTML = `
      <div class="filter-bar" id="filterBar">
        <span style="font-size:12px;font-weight:600;color:#374151">Time range:</span>
        <button class="range-btn ${activeRange==='today'?'active':''}" onclick="setRange('today')">Today</button>
        <button class="range-btn ${activeRange==='7'?'active':''}" onclick="setRange('7')">Last 7 Days</button>
        <button class="range-btn ${activeRange==='30'?'active':''}" onclick="setRange('30')">Last 30 Days</button>
        <button class="range-btn ${activeRange==='all'?'active':''}" onclick="setRange('all')">All Time</button>
        <span style="font-size:12px;color:#6b7280">|</span>
        <label>From</label>
        <input type="date" id="fromDate" value="${customFrom}" onchange="customFrom=this.value" />
        <label>To</label>
        <input type="date" id="toDate" value="${customTo}" onchange="customTo=this.value" />
        <button class="range-btn ${activeRange==='custom'?'active':''}" onclick="setRange('custom')">Apply Custom</button>
      </div>

      <!-- Stat cards -->
      <div class="cards">
        <div class="card"><div class="num">${Number(data.total).toLocaleString()}</div><div class="label">Total Scans (all time)</div></div>
        <div class="card"><div class="num">${todayCount}</div><div class="label">Today</div></div>
        <div class="card"><div class="num">${data.filteredTotal ?? data.recent.length}</div><div class="label">In Selected Range</div></div>
        <div class="card"><div class="num">${located.length}</div><div class="label">With GPS (shown)</div></div>
      </div>

      <!-- Top Locations + Device breakdown -->
      <div class="two-col">
        <div class="leaderboard">
          <h3 style="margin:0 0 10px">📍 Top Banner Locations</h3>
          ${renderLeaderboard(data.topLocations)}
        </div>
        <div>
          <div class="device-wrap" style="margin-bottom:12px">
            <h3 style="margin:0 0 10px">📱 Device Split</h3>
            ${renderDevices(data.byDevice)}
          </div>
          <div class="hourly-wrap">
            <h3 style="margin:0 0 4px">🕐 Scans by Hour (all time, UTC)</h3>
            ${renderHourly(data.hourCounts)}
          </div>
        </div>
      </div>

      <!-- Map -->
      <h3>Where scans are happening</h3>
      <div class="note">${located.length} of ${data.recent.length} shown scans have GPS. ${noLoc} didn't allow location. Clusters = busy banner spots.</div>
      <div id="map"></div>

      <!-- Scan table -->
      <div class="table-header">
        <h3 style="margin:0">Recent Scans</h3>
        <button class="btn btn-danger" id="deleteBtn" onclick="deleteSelected()" disabled>Delete Selected</button>
        <button class="btn btn-export" onclick="exportCSV()">Export CSV</button>
        <span id="selCount" style="font-size:12px;color:#6b7280"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll" onchange="toggleAll(this)"></th>
              <th>Time</th>
              <th>Place Name</th>
              <th>GPS</th>
              <th>IP Location</th>
              <th>Device</th>
              <th>IP</th>
            </tr>
          </thead>
          <tbody id="scanBody">
            ${renderRows(data.recent)}
          </tbody>
        </table>
      </div>
    `;

    renderMap(located);
  }

  // ── SUB-RENDERERS ─────────────────────────────────────────────────────────────
  function renderLeaderboard(locations) {
    if (!locations || !locations.length) return '<div class="empty">No location data yet</div>';
    const max = locations[0].count;
    return locations.slice(0, 10).map((loc, i) => `
      <div class="lb-row">
        <div class="lb-rank">${i + 1}</div>
        <div class="lb-name">${escHtml(loc.name)}</div>
        <div class="lb-bar-wrap"><div class="lb-bar" style="width:${Math.round((loc.count/max)*100)}%"></div></div>
        <div class="lb-count">${loc.count}</div>
      </div>`).join('');
  }

  function renderDevices(byDevice) {
    if (!byDevice || !Object.keys(byDevice).length) return '<div class="empty">No data yet</div>';
    const entries = Object.entries(byDevice).sort((a,b) => b[1]-a[1]);
    const max = entries[0][1];
    return entries.map(([dev, count]) => `
      <div class="device-row">
        <div class="device-name">${escHtml(dev)}</div>
        <div class="device-bar-wrap"><div class="device-bar" style="width:${Math.round((count/max)*100)}%"></div></div>
        <div class="device-count">${count}</div>
      </div>`).join('');
  }

  function renderHourly(hourCounts) {
    if (!hourCounts) return '';
    const vals = Object.entries(hourCounts).sort((a,b) => +a[0] - +b[0]).map(e => +e[1]);
    const max = Math.max(...vals, 1);
    const bars = vals.map((v, h) => `
      <div class="hour-bar-col" title="${h}:00 — ${v} scans">
        <div class="hour-bar" style="height:${Math.max(4, Math.round((v/max)*72))}px"></div>
        <div class="hour-label">${h}</div>
      </div>`).join('');
    return `<div class="hour-bars">${bars}</div>`;
  }

  function renderRows(scans) {
    if (!scans || !scans.length) return '<tr><td colspan="7" class="empty">No scans yet</td></tr>';
    return scans.map(r => {
      const gps = r.lat != null ? `${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}` : '<span style="color:#d1d5db">—</span>';
      const ipLoc = [r.city, r.region, r.country].filter(Boolean).join(', ') || '—';
      const place = r.placeName ? `<span style="color:#059669;font-weight:500">${escHtml(r.placeName)}</span>` : '<span style="color:#d1d5db">—</span>';
      const ts = r.ts;
      return `<tr id="row-${ts}" class="${selectedTs.has(ts)?'selected':''}">
        <td><input type="checkbox" data-ts="${ts}" ${selectedTs.has(ts)?'checked':''} onchange="toggleRow(this,'${ts}')"></td>
        <td style="white-space:nowrap">${new Date(ts).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour12:true})}</td>
        <td>${place}</td>
        <td style="font-size:11px;color:#6b7280">${gps}</td>
        <td>${escHtml(ipLoc)}</td>
        <td><span class="tag">${escHtml(r.device || shortUA(r.userAgent))}</span></td>
        <td style="font-size:11px;color:#9ca3af">${escHtml(r.ip)}</td>
      </tr>`;
    }).join('');
  }

  // ── MAP ───────────────────────────────────────────────────────────────────────
  function renderMap(located) {
    const mapEl = document.getElementById('map');
    if (!located.length) {
      mapEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#9ca3af;font-size:13px;background:#f9fafb;border-radius:10px">No GPS-tagged scans in this range</div>';
      return;
    }
    if (map) { map.remove(); map = null; }
    const avgLat = located.reduce((s, r) => s + r.lat, 0) / located.length;
    const avgLon = located.reduce((s, r) => s + r.lon, 0) / located.length;
    map = L.map('map').setView([avgLat, avgLon], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    located.forEach(r => {
      const popup = `<b>${r.placeName || 'GPS scan'}</b><br>${new Date(r.ts).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour12:true})}<br><small>${r.lat.toFixed(5)}, ${r.lon.toFixed(5)}</small>`;
      L.circleMarker([r.lat, r.lon], {
        radius: 7, color: '#fff', weight: 2, fillColor: '#e63946', fillOpacity: 0.85
      }).bindPopup(popup).addTo(map);
    });
  }

  // ── SELECTION ─────────────────────────────────────────────────────────────────
  function toggleRow(cb, ts) {
    if (cb.checked) selectedTs.add(ts);
    else selectedTs.delete(ts);
    const row = document.getElementById(`row-${ts}`);
    if (row) row.className = cb.checked ? 'selected' : '';
    updateDeleteBtn();
  }

  function toggleAll(masterCb) {
    const boxes = document.querySelectorAll('#scanBody input[type=checkbox]');
    boxes.forEach(cb => {
      const ts = cb.dataset.ts;
      cb.checked = masterCb.checked;
      if (masterCb.checked) selectedTs.add(ts);
      else selectedTs.delete(ts);
      const row = document.getElementById(`row-${ts}`);
      if (row) row.className = masterCb.checked ? 'selected' : '';
    });
    updateDeleteBtn();
  }

  function updateDeleteBtn() {
    const btn = document.getElementById('deleteBtn');
    const countEl = document.getElementById('selCount');
    if (!btn) return;
    btn.disabled = selectedTs.size === 0;
    countEl.textContent = selectedTs.size > 0 ? `${selectedTs.size} selected` : '';
  }

  // ── DELETE ────────────────────────────────────────────────────────────────────
  async function deleteSelected() {
    if (selectedTs.size === 0) return;
    if (!confirm(`Delete ${selectedTs.size} selected scan(s)? This also updates the counters.`)) return;

    const key = document.getElementById('adminKey').value.trim();
    // Find the actual record objects for selected timestamps
    const toDelete = currentData.recent.filter(r => selectedTs.has(r.ts));
    if (!toDelete.length) { alert('Could not find matching records.'); return; }

    try {
      const res = await fetch(DELETE_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, entries: toDelete })
      });
      const result = await res.json();
      if (!res.ok || !result.ok) throw new Error(result.error || 'Delete failed');
      alert(`Deleted ${result.deleted} scan(s). Reloading data…`);
      load();
    } catch(e) {
      alert('Error: ' + e.message);
    }
  }

  // ── EXPORT CSV ────────────────────────────────────────────────────────────────
  function exportCSV() {
    if (!currentData || !currentData.recent.length) { alert('Load data first.'); return; }
    const cols = ['ts','source','ip','placeName','lat','lon','city','region','country','device','userAgent','referrer'];
    const header = cols.join(',');
    const rows = currentData.recent.map(r =>
      cols.map(c => {
        const v = r[c] ?? '';
        return '"' + String(v).replace(/"/g, '""') + '"';
      }).join(',')
    );
    const csv = [header, ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `qr-scans-${today()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── RANGE FILTER ──────────────────────────────────────────────────────────────
  function setRange(range) {
    activeRange = range;
    if (range === 'custom') {
      const f = document.getElementById('fromDate');
      const t = document.getElementById('toDate');
      if (f) customFrom = f.value;
      if (t) customTo = t.value;
      if (!customFrom || !customTo) { alert('Pick both From and To dates.'); return; }
    }
    load();
  }

  // ── UTILS ─────────────────────────────────────────────────────────────────────
  function shortUA(ua) {
    if (!ua) return '—';
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/Android/.test(ua)) return 'Android';
    if (/iPad/.test(ua)) return 'iPad';
    if (/Windows/.test(ua)) return 'Windows';
    if (/Macintosh/.test(ua)) return 'Mac';
    return ua.slice(0, 20) + '…';
  }

  function escHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  </script>
</body>
</html>
